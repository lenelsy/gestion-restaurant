<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Délices — Finaliser ma commande</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#faf8f3;min-height:100vh;}
nav{background:linear-gradient(135deg,#1a2744,#2a3550);padding:16px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.nav-logo{font-family:Georgia,serif;font-size:1.5rem;font-weight:900;font-style:italic;color:#b49140;text-decoration:none;}
.page{max-width:750px;margin:40px auto;padding:0 20px;}
.card{background:white;border-radius:16px;padding:36px;box-shadow:0 4px 20px rgba(0,0,0,0.07);margin-bottom:20px;}
.card-title{font-family:Georgia,serif;font-size:1.3rem;font-style:italic;color:#1a2744;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid #f5f0e8;}
.recap-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:0.9rem;}
.recap-item:last-child{border-bottom:none;}
.total-row{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:2px solid #f5f0e8;}
.total-montant{font-size:1.3rem;font-weight:900;color:#b49140;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:0.78rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;}
.fg input,.fg select{width:100%;padding:12px 14px;border:1px solid #dee2e6;border-radius:8px;font-size:0.9rem;outline:none;transition:border-color 0.2s;}
.fg input:focus,.fg select:focus{border-color:#b49140;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
.option-label{border:2px solid #dee2e6;border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;transition:all 0.2s;display:block;}
.option-label:hover{border-color:#b49140;background:#fffdf5;}
.option-label input[type=radio]{display:none;}
.option-label.selected{border-color:#b49140;background:#fff8e1;}
.option-label span{font-size:2rem;display:block;margin-bottom:8px;}
.option-label p{font-size:0.88rem;font-weight:700;color:#1a2744;}
.option-label small{font-size:0.75rem;color:#888;display:block;margin-top:4px;}
.livraison-box{background:#f8f9fa;border-radius:12px;padding:20px;margin-bottom:20px;display:none;}
.livraison-box.show{display:block;}
.livraison-box p{font-weight:700;color:#1a2744;margin-bottom:14px;font-size:0.9rem;}
.btn-submit{width:100%;padding:15px;background:linear-gradient(135deg,#c9973a,#b8832a);border:none;border-radius:10px;color:white;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s;margin-top:8px;}
.btn-submit:hover{box-shadow:0 6px 22px rgba(180,130,40,0.5);transform:translateY(-2px);}
.btn-annuler{display:block;text-align:center;margin-top:14px;color:#888;font-size:0.85rem;text-decoration:none;transition:color 0.2s;}
.btn-annuler:hover{color:#e94560;}
@media(max-width:500px){.options{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav>
  <a href="/Restaurant/" class="nav-logo">Les Délices</a>
</nav>

<div class="page">

  <div class="card">
    <div class="card-title">🧾 Récapitulatif</div>
    {% for pid, item in panier.items %}
    <div class="recap-item">
      <span>{{ item.nom }} × {{ item.quantite }}</span>
      <strong>{{ item.prix }} F CFA</strong>
    </div>
    {% endfor %}
    <div class="total-row">
      <span style="font-weight:700;color:#1a2744;">Total</span>
      <span class="total-montant">{{ total }} F CFA</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📋 Vos informations</div>
    <form method="post" id="checkoutForm">
      {% csrf_token %}
      <div class="form-row">
        <div class="fg">
          <label>Nom</label>
          <input type="text" name="nom" placeholder="Ex: Ngono" required>
        </div>
        <div class="fg">
          <label>Prénom</label>
          <input type="text" name="prenom" placeholder="Ex: Patrick" required>
        </div>
      </div>
      <div class="form-row">
        <div class="fg">
          <label>Téléphone</label>
          <input type="tel" name="tel" placeholder="699112233" required>
        </div>
        <div class="fg">
          <label>Mode de paiement</label>
          <select name="paiement">
            <option value="Espèces">💵 Espèces</option>
            <option value="Orange Money">🟠 Orange Money</option>
            <option value="MTN MoMo">🟡 MTN MoMo</option>
          </select>
        </div>
      </div>

      <div class="card-title" style="margin-top:10px;margin-bottom:18px;">🚀 Mode de réception</div>

      <div class="options">
        <label class="option-label" id="opt-surplace">
          <input type="radio" name="type_commande" value="Sur place" onchange="selectType('surplace')">
          <span>🪑</span>
          <p>Sur place</p>
          <small>Mangez au restaurant</small>
        </label>
        <label class="option-label" id="opt-livraison">
          <input type="radio" name="type_commande" value="À livrer" onchange="selectType('livraison')">
          <span>🚚</span>
          <p>Livraison</p>
          <small>Livré chez vous</small>
        </label>
        <label class="option-label" id="opt-emporter">
          <input type="radio" name="type_commande" value="À emporter" onchange="selectType('emporter')">
          <span>🥡</span>
          <p>À emporter</p>
          <small>Récupérez votre commande</small>
        </label>
      </div>

      <div class="livraison-box" id="livraisonBox">
        <p>🚚 Informations de livraison</p>
        <div class="fg">
          <label>Adresse complète</label>
          <input type="text" name="adresse" placeholder="Ex: Quartier Bastos, Yaoundé">
        </div>
        <div class="fg">
          <label>Indication supplémentaire</label>
          <input type="text" name="quartier" placeholder="Ex: En face de la pharmacie">
        </div>
      </div>

      <button type="submit" class="btn-submit" onclick="return validerForm()">
        ✅ Confirmer et générer ma facture
      </button>
      <a href="/Restaurant/panier/" class="btn-annuler">← Retour au panier</a>
    </form>
  </div>
</div>

<script>
function selectType(type) {
  ['surplace','livraison','emporter'].forEach(t => {
    document.getElementById('opt-'+t).classList.remove('selected');
  });
  document.getElementById('opt-'+type).classList.add('selected');
  const box = document.getElementById('livraisonBox');
  box.classList.toggle('show', type === 'livraison');
}

function validerForm() {
  const type = document.querySelector('input[name=type_commande]:checked');
  if (!type) {
    alert('⚠️ Veuillez choisir un mode de réception !');
    return false;
  }
  return true;
}
</script>
</body>
</html>
