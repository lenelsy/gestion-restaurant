<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Delices du Groupe 1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Georgia,serif;
  min-height:100vh;
  background:linear-gradient(160deg,#f5f0e8 0%,#ede4d0 40%,#e8dfc8 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:700px;height:700px;
  background:radial-gradient(ellipse at center,rgba(180,160,110,0.2) 0%,rgba(150,190,200,0.12) 35%,rgba(180,160,220,0.08) 60%,transparent 70%);
  border-radius:50%;
  pointer-events:none;
}
body::after{
  content:"";
  position:fixed;
  top:14px;left:14px;right:14px;bottom:14px;
  border:2px solid rgba(180,145,60,0.45);
  border-radius:6px;
  pointer-events:none;
  z-index:200;
}
.page{
  text-align:center;
  padding:50px 30px;
  max-width:680px;
  width:100%;
  position:relative;
  z-index:1;
}
.tag{
  display:block;
  color:#b49140;
  font-family:'Segoe UI',sans-serif;
  font-size:0.75rem;
  letter-spacing:7px;
  text-transform:uppercase;
  margin-bottom:20px;
}
.titre{
  font-size:5rem;
  font-weight:900;
  font-style:italic;
  color:#1a2744;
  line-height:1;
  margin-bottom:12px;
}
.sous{
  font-family:'Segoe UI',sans-serif;
  font-size:0.8rem;
  letter-spacing:9px;
  color:#5a6a8a;
  text-transform:uppercase;
  margin-bottom:24px;
}
.ligne{
  width:90px;
  height:2px;
  background:linear-gradient(90deg,transparent,#b49140,transparent);
  margin:0 auto 32px;
}
.question{
  font-size:1.3rem;
  color:#2a3550;
  margin-bottom:42px;
}
.cards{
  display:flex;
  gap:28px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:50px;
}
.card{
  width:240px;
  padding:42px 30px;
  border-radius:10px;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover{
  transform:translateY(-9px);
}
.card-client{
  background:linear-gradient(150deg,#d4a33e,#c9973a,#b8832a,#a87220);
  box-shadow:0 10px 35px rgba(180,130,40,0.45);
}
.card-client:hover{
  box-shadow:0 18px 45px rgba(180,130,40,0.6);
}
.card-personnel{
  background:rgba(255,255,255,0.6);
  border:2.5px solid #c9973a;
  box-shadow:0 10px 35px rgba(180,130,40,0.18);
  backdrop-filter:blur(12px);
}
.card-personnel:hover{
  background:rgba(255,255,255,0.9);
  box-shadow:0 18px 45px rgba(180,130,40,0.32);
}
.ico{font-size:3rem;display:block;}
.lbl{
  font-family:'Segoe UI',sans-serif;
  font-size:0.85rem;
  letter-spacing:1px;
  font-weight:400;
}
.nom{
  font-size:1.6rem;
  font-weight:800;
  font-family:Georgia,serif;
  line-height:1;
}
.card-client .lbl{color:rgba(255,255,255,0.8);}
.card-client .nom{color:#ffffff;}
.card-personnel .lbl{color:#5a6a8a;}
.card-personnel .nom{color:#b49140;}
.pied{
  font-family:'Segoe UI',sans-serif;
  font-size:0.74rem;
  letter-spacing:5px;
  color:#b49140;
}
</style>
</head>
<body>

<div class="page">
  <span class="tag">&#10022; &nbsp;&nbsp; Bienvenue &nbsp;&nbsp; &#10022;</span>
  <h1 class="titre">Les D&eacute;lices</h1>
  <p class="sous">Du &nbsp; Groupe &nbsp; 1</p>
  <div class="ligne"></div>
  <p class="question">Qui &ecirc;tes-vous ?</p>

  <div class="cards">
    <a href="/Restaurant/" class="card card-client">
      <span class="ico">&#127869;&#65039;</span>
      <span class="lbl">Je suis</span>
      <span class="nom">Client</span>
    </a>
    <a href="/personnel/login/" class="card card-personnel">
      <span class="ico">&#129333;&#8205;&#9792;&#65039;</span>
      <span class="lbl">Je suis</span>
      <span class="nom">Personnel</span>
    </a>
  </div>

  <p class="pied">&#10022; &nbsp; Les D&eacute;lices du Groupe 1 &nbsp; &#10022;</p>
</div>

</body>
</html>
