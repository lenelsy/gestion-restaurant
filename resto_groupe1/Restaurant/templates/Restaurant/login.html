<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Délices du Groupe 1 — Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }

        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            width: 400px;
            border-top: 6px solid #C9A84C;
            border-bottom: 6px solid #C9A84C;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            font-size: 13px;
            letter-spacing: 4px;
            color: #C9A84C;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 26px;
            color: #1a1a1a;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 12px;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: #C9A84C;
            margin: 0 auto 30px auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 2px;
            font-size: 14px;
            font-family: 'Georgia', serif;
            color: #1a1a1a;
            background: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #C9A84C;
            background: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #C9A84C;
            color: #fff;
            border: none;
            border-radius: 2px;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #b8943d;
        }

        .error {
            background: #fff3f3;
            border-left: 3px solid #e74c3c;
            color: #e74c3c;
            padding: 10px 15px;
            font-size: 13px;
            text-align: left;
            margin-bottom: 20px;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: #bbb;
            letter-spacing: 1px;
        }

        .star {
            color: #C9A84C;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="logo">✦ Bienvenue ✦</div>
    <h1>Les Délices</h1>
    <p class="subtitle">du Groupe 1</p>
    <div class="divider"></div>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
        <div class="error">
            Identifiant ou mot de passe incorrect.
        </div>
        {% endif %}

        <div class="form-group">
            <label for="id_username">Identifiant</label>
            <input type="text" name="username" id="id_username"
                   placeholder="Votre identifiant" autofocus>
        </div>
        <div class="form-group">
            <label for="id_password">Mot de passe</label>
            <input type="password" name="password" id="id_password"
                   placeholder="Votre mot de passe">
        </div>

        <button type="submit" class="btn">Se connecter</button>
    </form>

    <p class="footer-text">
        <span class="star">✦</span>
        Espace réservé au personnel
        <span class="star">✦</span>
    </p>

</div>
</body>
</html>
