<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion — RestaurantPro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
    .logo{text-align:center;margin-bottom:30px}
    .logo .icon{font-size:3.2rem}
    .logo h2{font-size:1.5rem;font-weight:800;color:#1a1a2e;margin:10px 0 4px}
    .logo p{color:#888;font-size:.88rem}
    .msg-err{background:#f8d7da;color:#721c24;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:.88rem}
    label{font-size:.82rem;font-weight:700;color:#444;display:block;margin-bottom:6px}
    input[type=text],input[type=password]{width:100%;padding:13px 16px;border:2px solid #e8e8e8;border-radius:10px;font-size:.95rem;outline:none;transition:border-color .2s;margin-bottom:16px}
    input:focus{border-color:#f4a825}
    .btn-login{width:100%;padding:14px;background:#1a1a2e;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:6px}
    .btn-login:hover{background:#0f3460}
    .back{text-align:center;margin-top:20px}
    .back a{color:#888;font-size:.85rem;text-decoration:none}
    .back a:hover{color:#f4a825}
    .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#ccc;font-size:.8rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#eee}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="icon">🍽️</div>
      <h2>RestaurantPro</h2>
      <p>Espace Personnel — ENSPY 2025-2026</p>
    </div>
 
    {% if form.errors %}
    <div class="msg-err">❌ Identifiant ou mot de passe incorrect.</div>
    {% endif %}
 
    {% for m in messages %}
    <div class="msg-err" style="{% if 'success' in m.tags %} background:#d4edda;color:#155724{% endif %}">
      {{ m }}
    </div>
    {% endfor %}
 
    <form method="post">
      {% csrf_token %}
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" autofocus required placeholder="ex: admin">
      <label>Mot de passe</label>
      <input type="password" name="password" required placeholder="••••••••">
      <button type="submit" class="btn-login">🔐 Se connecter</button>
    </form>
 
    <div class="divider">accès public</div>
    <div class="back">
      <a href="{% url 'accueil' %}">← Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
