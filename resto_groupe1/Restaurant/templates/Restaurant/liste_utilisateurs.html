<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Titre de la page dans l'onglet du navigateur -->
    <title>Gestion des Utilisateurs</title>
    <!-- Style CSS intégré pour une interface propre -->
    <style>
        /* Style général de la page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        /* Style du titre principal */
        h1 {
            color: #B8860B;
            text-align: center;
        }
        /* Style du tableau */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        /* Style des cellules */
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        /* Style de l'en-tête du tableau */
        th {
            background-color: #B8860B;
            color: white;
        }
        /* Style des boutons */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        /* Bouton modifier en bleu */
        .btn-modifier {
            background-color: #3498db;
        }
        /* Bouton supprimer en rouge */
        .btn-supprimer {
            background-color: #e74c3c;
        }
        /* Bouton ajouter en vert */
        .btn-ajouter {
            background-color: #2ecc71;
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <!-- Titre de la page -->
    <h1>★ Gestion des Utilisateurs ★</h1>

    <!-- Bouton pour créer un nouvel utilisateur -->
    <a href="/restaurant/utilisateurs/creer/" class="btn btn-ajouter">
        + Ajouter un utilisateur
    </a>

    <!-- Tableau listant tous les utilisateurs -->
    <table>
        <thead>
            <tr>
                <!-- En-têtes des colonnes -->
                <th>Nom d'utilisateur</th>
                <th>Email</th>
                <th>Rôle</th>
                <th>Téléphone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Boucle sur tous les profils utilisateurs -->
            {% for profil in profils %}
            <tr>
                <!-- Affichage des données de chaque utilisateur -->
                <td>{{ profil.user.username }}</td>
                <td>{{ profil.user.email }}</td>
                <td>{{ profil.get_role_display }}</td>
                <td>{{ profil.telephone }}</td>
                <td>
                    <!-- Bouton modifier -->
                    <a href="/restaurant/utilisateurs/modifier/{{ profil.id }}/"
                       class="btn btn-modifier">Modifier</a>
                    <!-- Bouton supprimer -->
                    <a href="/restaurant/utilisateurs/supprimer/{{ profil.id }}/"
                       class="btn btn-supprimer">Supprimer</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
